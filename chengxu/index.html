<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上线了 - 登录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>上线了</h1>
                <p class="domain">SXL.CN</p>
            </div>
            
            <div class="login-type-selector">
                <button class="type-btn active" data-type="phone">手机</button>
                <button class="type-btn" data-type="email">邮箱</button>
            </div>
            
            <div class="description">
                你必须先登录才能管理此网站。
            </div>
            
            <form class="login-form">
                <div class="input-group phone-input">
                    <select class="country-code">
                        <option value="+86">+86</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>
                    <input type="tel" placeholder="请输入手机号" class="phone-field">
                </div>
                
                <div class="input-group email-input" style="display: none;">
                    <input type="email" placeholder="请输入邮箱" class="email-field">
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="密码" class="password-field">
                </div>
                
                <button type="submit" class="login-btn">登录</button>
            </form>
            
            <div class="login-options">
                <a href="#" class="sms-login">使用短信验证码登录</a>
                <a href="#" class="forgot-password">忘记密码?</a>
            </div>
            
            <div class="third-party">
                <div class="divider">
                    <span>或使用第三方账号登录</span>
                </div>
                <div class="third-party-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.017 0C5.396 0 .029 5.367.029 11.987c0 5.079 3.158 9.417 7.618 11.174-.105-.949-.199-2.403.042-3.441.219-.937 1.404-5.965 1.404-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345l-.333 1.36c-.053.22-.174.267-.402.161-1.499-.698-2.436-2.888-2.436-4.649 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.357-.631-2.749-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24.009 12.017 24c6.624 0 11.99-5.367 11.99-11.987C24.007 5.367 18.641.001 12.017.001z"/>
                    </svg>
                </div>
            </div>
            
            <div class="register-link">
                没有账户? <a href="#">免费注册</a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
